<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/app/favicon.ico" type="image/x-icon" />
        <title>{{.Title}}</title>
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

            body {
              background: #fff;
              color: #e5e5e5;
              font-family: system-ui, -apple-system, sans-serif;
              min-height: 100vh;
            }

            header {
              padding: 1.25rem 2rem;
              max-width: 1400px;
              margin: 0 auto;
            }

            .header-row {
              display: flex;
              align-items: flex-end;
              gap: 2rem;
            }

            h1 {
              font-size: 1.5rem;
              font-weight: 600;
              letter-spacing: 0.05em;
              text-transform: uppercase;
              flex-shrink: 0;
            }

            h1 a {
              color: #000;
              text-decoration: none;
            }

            .description {
              margin-top: 0.5rem;
              color: #999;
              font-size: 0.9rem;
            }

            nav.tabs {
              display: flex;
              gap: 0;
            }

            nav.tabs a {
              padding: 0.25rem 0.75rem;
              color: #000;
              text-decoration: none;
              font-size: 0.85rem;
              letter-spacing: 0.05em;
              text-transform: uppercase;
              transition: color 0.15s;
            }

            nav.tabs a:hover { color: #555; }
            nav.tabs a.active { color: #000; font-weight: 700; }

            .page-section { display: none; padding: 1rem 2rem 2rem; max-width: 1400px; margin: 0 auto; }
            .page-section.active { display: block; }

            /* No-JS fallback: show all sections */
            .no-js .page-section { display: block; margin-bottom: 2rem; }
            .no-js .page-section-title { display: block; }

            .page-section-title {
              display: none;
              font-size: 1rem;
              font-weight: 600;
              letter-spacing: 0.05em;
              text-transform: uppercase;
              margin-bottom: 0.75rem;
              color: #999;
            }

            .grid {
              display: grid;
              grid-template-columns: repeat(3, 1fr);
              grid-auto-flow: row dense;
              gap: {{.GapPx}}px;
            }

            .grid-item {
              background: #fff;
              overflow: hidden;
            }

            .grid-item img {
              width: 100%;
              height: 100%;
              object-fit: cover;
              display: block;
            }

            @media (max-width: 900px) {
              .grid {
                  display: flex;
                  flex-direction: column;
              }
            }
            @media (max-width: 500px) {
              header { padding: 1.25rem 1rem 0.75rem; }
              .page-section { padding: 0.75rem 1rem 1.5rem; }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="header-row">
                <h1>
                    <a
                        id="title-link"
                        href="#page-{{(index .Pages 0).Slug}}"
                        data-page="{{(index .Pages 0).Slug}}"
                        >{{.Title}}</a
                    >
                </h1>
                {{if gt (len .Pages) 1}}
                <nav class="tabs" id="tabs">
                    {{range $i, $page := .Pages}}{{if gt $i 0}}
                    <a href="#page-{{$page.Slug}}" data-page="{{$page.Slug}}"
                        >{{$page.Title}}</a
                    >
                    {{end}}{{end}}
                </nav>
                {{end}}
            </div>
            {{if .Description}}
            <p class="description">{{.Description}}</p>
            {{end}}
        </header>

        {{range $i, $page := .Pages}}
        <section
            id="page-{{$page.Slug}}"
            class="page-section {{if eq $i 0}}active{{end}}"
        >
            {{if gt (len $.Pages) 1}}
            <h2 class="page-section-title">{{$page.Title}}</h2>
            {{end}}
            <div class="grid">
                {{range $page.Images}}
                <div
                    class="grid-item"
                    style="grid-column:span {{.ColSpan}};grid-row:span {{.RowSpan}};aspect-ratio:{{.ColSpan}}/{{.RowSpan}};padding:{{$.MattePx}}px;"
                >
                    <img src="{{.SrcURL}}" alt="{{.Filename}}" loading="lazy" />
                </div>
                {{end}}
            </div>
        </section>
        {{end}}

        <script>
            (function () {
                var tabs = document.getElementById("tabs");
                var titleLink = document.getElementById("title-link");
                var sections = document.querySelectorAll(".page-section");
                var links = tabs ? tabs.querySelectorAll("a[data-page]") : [];

                function show(slug) {
                    links.forEach(function (l) {
                        l.classList.toggle("active", l.dataset.page === slug);
                    });
                    sections.forEach(function (s) {
                        s.classList.toggle("active", s.id === "page-" + slug);
                    });
                }

                // Handle hash on load
                var hash = location.hash.replace("#page-", "");
                if (hash) show(hash);

                if (tabs) {
                    tabs.addEventListener("click", function (e) {
                        var link = e.target.closest("a[data-page]");
                        if (!link) return;
                        e.preventDefault();
                        history.pushState(
                            null,
                            "",
                            "#page-" + link.dataset.page,
                        );
                        show(link.dataset.page);
                    });
                }

                if (titleLink) {
                    titleLink.addEventListener("click", function (e) {
                        e.preventDefault();
                        history.pushState(null, "", location.pathname);
                        show(titleLink.dataset.page);
                    });
                }

                window.addEventListener("popstate", function () {
                    var h = location.hash.replace("#page-", "");
                    if (h) show(h);
                });
            })();
        </script>
    </body>
</html>
