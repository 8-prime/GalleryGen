[package]
name = "gallerygen-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bcrypt = "0.17"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
minijinja = { version = "2", features = ["builtins"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

