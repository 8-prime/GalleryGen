proxy_cache_path /var/cache/nginx/images
    levels=1:2
    keys_zone=images_cache:10m
    max_size=10g
    inactive=30d
    use_temp_path=off;


upstream api {
    server api:8080;
}

upstream imgproxy {
    server imgproxy:8080;
}

server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # React SPA static files
    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
    }

    # Public portfolio pages — server-rendered by the Go backend
    location /p/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API — proxy to Go backend
    location /api/ {
        client_max_body_size 100m;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Direct public image serving from Go (no auth, UUID-keyed)
    location /media/ {
        proxy_pass http://api;
        proxy_cache images_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Image proxy — cached
    location /img/ {
        proxy_pass http://imgproxy/;
        proxy_cache images_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_set_header Host $host;
    }

    # Fallback — redirect bare root to the app
    location = / {
        return 302 /app/login;
    }
}
